<!DOCTYPE html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>카드뉴스 — 내가너를사랑하노라</title><style>
:root{--ink:#1f2a30;--muted:#5b727c;--bg:#f4f7f8;--card:#fff;--accent:#2c5364;--gold:#b8893a;--nav-h:52px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'Apple SD Gothic Neo','Helvetica Neue',sans-serif;line-height:1.75}
/* 상단 탭 (데스크톱) */
.topnav{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #dce6ea;
  display:flex;justify-content:center;height:var(--nav-h)}
.topnav a{display:flex;align-items:center;padding:0 18px;font-size:14px;font-weight:600;
  color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;
  transition:color .15s,border-color .15s}
.topnav a:hover{color:var(--ink)}
.topnav a.active{color:var(--accent);border-bottom-color:var(--accent)}
.topnav a[target="_blank"]::after{content:'↗';font-size:11px;margin-left:3px;opacity:.5}
/* 하단 독 (모바일) */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;border-top:1px solid #dce6ea;
  padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;padding:8px 4px;font-size:11px;font-weight:600;color:var(--muted);
  text-decoration:none;gap:3px;min-width:0}
.bottomnav a span.icon{font-size:18px;line-height:1}
.bottomnav a.active{color:var(--accent)}
.bottomnav a[target="_blank"]::after{content:'↗';font-size:9px;opacity:.5}
@media(max-width:640px){
  .topnav{display:none}
  .bottomnav{display:flex}
  .bottomnav-inner{display:flex;width:100%}
  .wrap{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
}
/* 본문 */
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px}
.kicker{font-size:14px;letter-spacing:4px;color:var(--gold);font-weight:700;text-transform:uppercase}
h1{font-family:'AppleMyungjo',serif;font-size:30px;line-height:1.3;margin:.3em 0 .1em}
.meta{color:var(--muted);font-size:15px;margin-bottom:8px}
h2{font-family:'AppleMyungjo',serif;font-size:22px;margin:1.6em 0 .4em;color:var(--accent)}
blockquote{margin:1.2em 0 1.2em 1.2em;padding:0;background:transparent;border:none;
  color:#33454d;font-size:16px;font-style:italic;opacity:.85}
ol,ul{padding-left:1.3em}li{margin:.3em 0}
.card{display:block;width:100%;border-radius:14px;margin:16px 0;box-shadow:0 4px 18px rgba(20,50,60,.12)}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.btn{display:block;background:var(--card);border:1px solid #dce6ea;border-radius:14px;
  padding:18px 20px;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(20,50,60,.06)}
.btn b{display:block;font-size:18px;margin-bottom:2px}
.btn span{color:var(--muted);font-size:14px}
.foot{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
a{color:var(--accent)}
/* 지난 설교 리뷰 — 한 줄 컴팩트 목록 */
.past-list{display:flex;flex-direction:column;margin-top:2px;
  background:var(--card);border:1px solid #dce6ea;border-radius:14px;overflow:hidden}
.past{display:flex;align-items:baseline;gap:10px;padding:11px 16px;
  text-decoration:none;color:var(--ink);border-top:1px solid #eef3f5;transition:background .15s}
.past:first-child{border-top:none}
.past:hover{background:#eef4f6}
.past-date{flex:none;font-size:12px;color:var(--gold);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
.past-title{flex:1;min-width:0;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.past-meta{flex:none;font-size:12px;color:var(--muted)}
@media(max-width:400px){.past-meta{display:none}}
